<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLMChatBot</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
marked.use({breaks:true,gfm:true,renderer:{code({text:code,lang}){
  if(lang&&typeof hljs!=='undefined'&&hljs.getLanguage(lang)){try{var h=hljs.highlight(code,{language:lang,ignoreIllegals:true});
  return'<div class="code-block"><div class="code-header"><span>'+lang+'</span><button class="copy-btn" onclick="copyCode(this)">复制</button></div><pre><code class="hljs language-'+lang+'">'+h.value+'</code></pre></div>';}catch(e){}}
  return'<pre><code>'+code+'</code></pre>';}}});
</script>
<style>
:root{--bg:linear-gradient(140deg,#f0f3f8 0%,#e8ecf1 100%);--surface:#fff;--surface2:#f8fafc;--text:#1a1a2e;--text2:#64748b;--user-bg:linear-gradient(135deg,#4080ff,#236be0);--ai-bg:#fff;--ai-border:#e2e8f0;--input-bg:#fff;--input-border:#d1d5db;--code-bg:#1e293b;--sep:#e2e8f0}
.dark{--bg:#0f172a;--surface:#1e293b;--surface2:#1a2332;--text:#e2e8f0;--text2:#94a3b8;--ai-bg:#1e293b;--ai-border:#334155;--input-bg:#1a2332;--input-border:#334155;--sep:#334155}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:"Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh;max-width:900px;margin:0 auto}
#top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--sep);flex-shrink:0;gap:8px}
#top-bar h1{font-size:16px;font-weight:700;white-space:nowrap;background:linear-gradient(135deg,#4080ff,#236be0);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.top-btn,.model-sel{font-size:11px;padding:4px 10px;border-radius:14px;border:1px solid var(--sep);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.top-btn:hover,.model-sel:hover{background:var(--sep);color:var(--text)}
.model-sel{padding:4px 8px;appearance:none;-webkit-appearance:none;text-align:center}
.model-name{font-size:11px;color:var(--text2);margin:0 2px}
#chat-list{flex:1;overflow-y:auto;padding:16px 12px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;width:100%;animation:fadeUp .35s ease-out}
.row.user{justify-content:flex-end}.row.ai{justify-content:flex-start}.row.system{justify-content:center}
.bubble{max-width:82%;padding:12px 16px;font-size:15px;line-height:1.6;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;word-break:break-word;position:relative}
.user .bubble{background:var(--user-bg);color:#fff;border-radius:18px 18px 4px 18px}
.ai .bubble{background:var(--ai-bg);color:var(--text);border:1px solid var(--ai-border);border-radius:18px 18px 18px 4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.system .bubble{background:0 0;color:var(--text2);text-align:center;font-size:13px;max-width:100%}
.time-stamp{font-size:10px;color:var(--text2);margin-top:3px;text-align:right}.ai .time-stamp{text-align:left}
.ai .bubble h1,.ai .bubble h2,.ai .bubble h3{font-size:17px;font-weight:700;margin:10px 0 4px}
.ai .bubble h1{font-size:19px;color:#2563eb}.ai .bubble h2{font-size:17px;color:#1e40af}.ai .bubble h3{font-size:16px;color:#333}
.ai .bubble p{margin:4px 0}.ai .bubble ul,.ai .bubble ol{margin:4px 0 4px 22px}.ai .bubble li{margin:3px 0}
.ai .bubble code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;font-family:Consolas,monospace;color:#e11d48}
.ai .bubble pre,.code-block{background:var(--code-bg);border-radius:10px;padding:14px;overflow-x:auto;margin:10px 0;font-size:13px;line-height:1.6}
.ai .bubble pre code{background:0 0;padding:0;font-size:13px;color:#e2e8f0}
.code-block{position:relative;margin:10px 0}.code-header{display:flex;justify-content:space-between;align-items:center;background:#334155;color:#94a3b8;font-size:12px;padding:6px 14px;border-radius:10px 10px 0 0;margin:-14px -14px 10px}
.copy-btn{background:#475569;color:#cbd5e1;border:none;padding:2px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .2s}
.copy-btn:hover{background:#64748b;color:#fff}
.ai .bubble blockquote{border-left:3px solid #3b82f6;padding:6px 14px;margin:10px 0;background:#eff6ff;border-radius:0 6px 6px 0;color:#475569}
.ai .bubble table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}
.ai .bubble th{background:#2563eb;color:#fff;padding:8px 12px;font-weight:600}
.ai .bubble td{border:1px solid #e2e8f0;padding:6px 12px}.ai .bubble tr:nth-child(even) td{background:#f8fafc}
.ai .bubble a{color:#3b82f6}.ai .bubble hr{border:0;border-top:1px solid var(--sep);margin:12px 0}.ai .bubble strong{font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.loading-dots{color:var(--text2);font-style:italic}
.loading-dots .dot{animation:blink 1.4s infinite;font-weight:700}
.loading-dots .dot:nth-child(2){animation-delay:.2s}.loading-dots .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,20%{opacity:0}50%{opacity:1}100%{opacity:0}}
#back-btn{position:absolute;right:20px;bottom:150px;background:linear-gradient(135deg,#4080ff,#236be0);color:#fff;border:none;border-radius:24px;padding:8px 18px;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(64,128,255,.25);display:none;z-index:10;transition:all .3s}
#back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(64,128,255,.35)}
#input-area{background:var(--surface);border-top:1px solid var(--sep);padding:10px 16px 14px;flex-shrink:0}
#quick-bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
#quick-bar button{font-size:12px;background:var(--surface2);color:#3b82f6;border:1px solid #bfdbfe;border-radius:20px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:all .2s}
#quick-bar button:hover{background:#dbeafe;border-color:#93c5fd;transform:translateY(-1px)}
#input-row{display:flex;gap:8px;align-items:flex-end}
#input-box{flex:1;padding:12px 16px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:24px;font-size:15px;font-family:inherit;resize:none;outline:none;min-height:46px;max-height:120px;line-height:1.5;color:var(--text);transition:border-color .2s}
#input-box:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
#send-btn{padding:12px 24px;background:linear-gradient(135deg,#4080ff,#236be0);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;box-shadow:0 2px 8px rgba(64,128,255,.2)}
#send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(64,128,255,.3)}
#send-btn:disabled{background:#93c5fd;box-shadow:none;cursor:not-allowed;transform:none}
#stop-btn{padding:12px 24px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(239,68,68,.2)}
#status{font-size:11px;color:var(--text2);padding:3px 18px 0}
.welcome-card{text-align:center;padding:40px 20px;animation:fadeUp .5s ease-out}
.welcome-card h2{font-size:24px;font-weight:700;background:linear-gradient(135deg,#4080ff,#236be0);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.welcome-card p{color:var(--text2);font-size:14px;margin-bottom:20px}
.welcome-card .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.welcome-card .suggestions button{padding:8px 16px;border-radius:20px;border:1px solid #bfdbfe;background:#fff;color:#3b82f6;font-size:13px;cursor:pointer;transition:all .2s}
.welcome-card .suggestions button:hover{background:#eff6ff;transform:translateY(-1px)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
#settings-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
#settings-dialog{background:var(--surface);border-radius:16px;padding:28px;width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.15);color:var(--text)}
#settings-dialog h3{font-size:18px;font-weight:700;margin-bottom:18px}
#settings-dialog label{display:block;font-size:13px;color:var(--text2);margin-top:12px;margin-bottom:4px}
#settings-dialog input,#settings-dialog select{width:100%;padding:10px 14px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;font-size:14px;margin-bottom:4px;color:var(--text)}
#settings-dialog .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#settings-dialog .btn-row button{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
#settings-dialog .btn-save{background:linear-gradient(135deg,#4080ff,#236be0);color:#fff}
#settings-dialog .btn-save:hover{transform:translateY(-1px)}
#settings-dialog .btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--sep)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>
</head>
<body>
<div id="app" style="position:relative">
<div id="top-bar">
  <h1>MultiLLM Chat</h1>
  <div class="top-btns">
    <select id="provider-sel" class="model-sel" onchange="onProviderChange()"></select>
    <select id="model-sel" class="model-sel" onchange="saveCurrentConfig()"></select>
    <span class="model-name" id="current-model-label"></span>
    <button class="top-btn" onclick="toggleTheme()" id="theme-btn">深色</button>
    <button class="top-btn" onclick="clearConversation()">清空</button>
    <button class="top-btn" onclick="openSettings()">API Key</button>
    <button class="top-btn" onclick="openModelConfig()">模型配置</button>
  </div>
</div>
<div id="chat-list"><div class="welcome-card"><h2>MultiLLM Chat</h2><p>多厂商模型一键切换 | 流式输出 | Markdown &amp; LaTeX</p><div class="suggestions"><button onclick="quickSend('用 Java 写一个冒泡排序')">用 Java 写冒泡排序</button><button onclick="quickSend('解释什么是机器学习')">解释什么是机器学习</button><button onclick="quickSend('帮我写一封英文邮件')">帮我写英文邮件</button></div></div></div>
<button id="back-btn" onclick="scrollToBottom()">回到底部</button>
<div id="input-area">
  <div id="quick-bar">
    <button onclick="quickSend('详细解释一下')">详细解释一下</button>
    <button onclick="quickSend('举个栗子')">举个栗子</button>
    <button onclick="quickSend('用代码实现')">用代码实现</button>
    <button onclick="quickSend('帮我优化')">帮我优化</button>
    <button onclick="quickSend('换个说法')">换个说法</button>
    <button onclick="quickSend('翻译成英文')">翻译成英文</button>
  </div>
  <div id="input-row">
    <textarea id="input-box" rows="1" placeholder="输入消息...（Enter发送，Shift+Enter换行）"></textarea>
    <button id="send-btn" onclick="sendMessage()">发送</button>
    <button id="stop-btn" onclick="stopGeneration()">停止</button>
  </div>
  <div id="status">就绪</div>
</div></div>
<div id="toast"></div>
<div id="settings-overlay" onclick="if(event.target===this)closeSettings()">
<div id="settings-dialog"><h3>配置 API Key</h3>
<label>当前厂商</label><p id="cfg-provider-name" style="font-weight:600;margin-bottom:8px"></p>
<label>API Key</label><input id="cfg-apikey" type="password" placeholder="sk-...">
<label><a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:#3b82f6">获取 API Key</a></label>
<label>自定义 Base URL (可选)</label><input id="cfg-baseurl" placeholder="https://api.deepseek.com/v1">
<div class="btn-row"><button class="btn-cancel" onclick="closeSettings()">取消</button><button class="btn-save" onclick="saveSettings()">保存</button></div>
</div></div>
<div id="model-config-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center" onclick="if(event.target===this)closeModelConfig()">
<div id="settings-dialog"><h3>多模型配置管理</h3><div id="config-list" style="max-height:400px;overflow-y:auto"></div>
<div class="btn-row"><button class="btn-cancel" onclick="closeModelConfig()">关闭</button></div></div></div>

<script>
// ===== 全局状态 =====
let chatList=document.getElementById('chat-list'),inputBox=document.getElementById('input-box');
let sendBtn=document.getElementById('send-btn'),stopBtn=document.getElementById('stop-btn');
let backBtn=document.getElementById('back-btn'),statusEl=document.getElementById('status');
let isLoading=false,currentAbort=null,userScrolledUp=false,sessionId='',isDark=false;
let providers=[],currentConfig={provider:'deepseek',modelName:'deepseek-chat',apiKey:'',baseUrl:'https://api.deepseek.com/v1',temperature:0.7,maxTokens:4096};
let savedConfigs={};

// ===== 主题 =====
function toggleTheme(){isDark=!isDark;document.body.classList.toggle('dark',isDark);document.getElementById('theme-btn').textContent=isDark?'浅色':'深色';localStorage.setItem('theme',isDark?'dark':'light')}
if(localStorage.getItem('theme')==='dark')toggleTheme();

// ===== 模型配置 =====
async function loadProviders(){
  try{let r=await fetch('/api/providers');providers=await r.json();
  let sel=document.getElementById('provider-sel');sel.innerHTML='';
  providers.forEach(p=>{let o=document.createElement('option');o.value=p.provider;o.textContent=p.providerName;sel.appendChild(o)});
  loadLocalConfigs();}catch(e){console.error(e)}
}
function loadLocalConfigs(){
  try{let raw=localStorage.getItem('modelConfigs');if(raw)savedConfigs=JSON.parse(raw)}
  catch(e){savedConfigs={}}
  let last=localStorage.getItem('lastProvider');
  if(last&&savedConfigs[last])currentConfig=savedConfigs[last];
  applyCurrentConfig();
}
function saveConfigs(){localStorage.setItem('modelConfigs',JSON.stringify(savedConfigs))}
function applyCurrentConfig(){
  let p=currentConfig.provider;document.getElementById('provider-sel').value=p;
  localStorage.setItem('lastProvider',p);
  onProviderChange(false);
  updateModelLabel();
}
function onProviderChange(save=true){
  let p=document.getElementById('provider-sel').value;
  let prov=providers.find(x=>x.provider===p);
  if(save){
    currentConfig.provider=p;
    currentConfig.baseUrl=prov?prov.baseUrl:'';
    // 如果该厂商已存过 key，复用
    if(savedConfigs[p]&&savedConfigs[p].apiKey)currentConfig.apiKey=savedConfigs[p].apiKey;
    else currentConfig.apiKey='';
    currentConfig.modelName=prov&&prov.modelOptions.length?prov.modelOptions[0].value:'';
    saveCurrentConfig();
  }
  let sel=document.getElementById('model-sel');sel.innerHTML='';
  if(prov){prov.modelOptions.forEach(m=>{let o=document.createElement('option');o.value=m.value;o.textContent=m.label;sel.appendChild(o)})}
  sel.value=currentConfig.modelName||(prov?prov.modelOptions[0].value:'');
  updateModelLabel();
}
function saveCurrentConfig(){
  let p=document.getElementById('provider-sel').value;
  let m=document.getElementById('model-sel').value;
  currentConfig.provider=p;currentConfig.modelName=m;
  savedConfigs[p]=Object.assign({},currentConfig);
  saveConfigs();updateModelLabel();
}
function updateModelLabel(){
  let p=providers.find(x=>x.provider===currentConfig.provider);
  document.getElementById('current-model-label').textContent=(p?p.providerName:'')+' / '+currentConfig.modelName;
}
document.getElementById('model-sel').addEventListener('change',saveCurrentConfig);

// ===== 会话 =====
async function initSession(){
  try{let r=await fetch('/api/session');let d=await r.json();sessionId=d.sid;document.cookie='sid='+sessionId+';path=/';
  let h=await fetch('/api/history');let ms=await h.json();
  if(ms.length>0){document.querySelector('.welcome-card')?.remove();ms.forEach(m=>addMessage(m.content,m.role==='USER'?'user':'ai'));}
  }catch(_){}
}

// ===== 消息渲染 =====
function addMessage(text,sender){
  let w=document.querySelector('.welcome-card');if(w)w.remove();
  let row=document.createElement('div');row.className='row '+sender;
  let bubble=document.createElement('div');bubble.className='bubble';
  if(sender==='ai')bubble.innerHTML=marked.parse(renderLatex(text));
  else if(sender==='system')bubble.innerHTML=text;
  else bubble.textContent=text;
  bubble.onclick=function(){copyText(bubble.textContent||bubble.innerText)};bubble.title='点击复制';
  let time=document.createElement('div');time.className='time-stamp';time.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  row.appendChild(time);row.appendChild(bubble);chatList.appendChild(row);
  if(!userScrolledUp)scrollToBottom();
}
function addLoading(){let w=document.querySelector('.welcome-card');if(w)w.remove();let row=document.createElement('div');row.className='row ai';row.id='loading-msg';let b=document.createElement('div');b.className='bubble loading-dots';b.textContent='思考中';let d=document.createElement('span');['.','.','.'].forEach(()=>{let s=document.createElement('span');s.className='dot';s.textContent='.';d.appendChild(s)});b.appendChild(d);row.appendChild(b);chatList.appendChild(row);if(!userScrolledUp)scrollToBottom()}
function removeLoading(){let e=document.getElementById('loading-msg');if(e)e.remove()}
function addAiBubble(){let old=document.getElementById('ai-stream');if(old)old.removeAttribute('id');let row=document.createElement('div');row.className='row ai';row.id='ai-stream';let b=document.createElement('div');b.className='bubble';b.onclick=function(){copyText(b.textContent)};b.title='点击复制';row.appendChild(b);chatList.appendChild(row)}
function updateAiBubble(text){let row=document.getElementById('ai-stream');if(!row)return;row.querySelector('.bubble').innerHTML=marked.parse(renderLatex(text));if(!userScrolledUp)scrollToBottom()}
function safeText(v){return typeof v==='string'?v:(v===null||v===undefined)?'':String(v)}
function renderLatex(text){text=safeText(text);text=text.replace(/\\\[([\s\S]*?)\\\]/g,(m,f)=>{try{return katex.renderToString(f.trim(),{displayMode:true,throwOnError:false})}catch(e){return m}});text=text.replace(/\\\(([\s\S]*?)\\\)/g,(m,f)=>{try{return katex.renderToString(f.trim(),{displayMode:false,throwOnError:false})}catch(e){return m}});return text}
function copyText(text){navigator.clipboard.writeText(text).then(()=>showToast('已复制')).catch(()=>{})}
function copyCode(btn){let code=btn.closest('.code-block').querySelector('code').textContent;navigator.clipboard.writeText(code).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1500)})}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1500)}

// ===== 发送 =====
async function sendMessage(){
  if(isLoading){stopGeneration();return}
  let text=inputBox.value.trim();if(!text)return;
  if(!currentConfig.apiKey){openSettings();return}
  addMessage(text,'user');inputBox.value='';inputBox.style.height='auto';inputBox.focus();
  addLoading();setLoading(true);let aiText='';
  try{
    currentAbort=new AbortController();
    let body={provider:currentConfig.provider,modelName:currentConfig.modelName,apiKey:currentConfig.apiKey,baseUrl:currentConfig.baseUrl,temperature:currentConfig.temperature,maxTokens:currentConfig.maxTokens,messages:[{role:'user',content:text}]};
    let resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:currentAbort.signal});
    removeLoading();addAiBubble();
    let reader=resp.body.getReader(),decoder=new TextDecoder(),buffer='',currentEvent='',eventLines=[];
    while(true){
      let{done,value}=await reader.read();
      if(done){if(currentEvent==='chunk'&&eventLines.length>0){aiText+=eventLines.join('\n');updateAiBubble(aiText)}break}
      buffer+=decoder.decode(value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop();
      for(let line of lines){
        if(line===''){
          if(currentEvent==='chunk'&&eventLines.length>0){try{let o=JSON.parse(eventLines.join('\n'));if(o.type==='chunk'){aiText+=o.content||'';updateAiBubble(aiText)}else if(o.type==='error'){updateAiBubble('[错误] '+o.errMsg)}}catch(e){aiText+=eventLines.join('\n');updateAiBubble(aiText)}}
          else if(currentEvent==='done'){setLoading(false);statusEl.textContent='就绪'}
          currentEvent='';eventLines=[];
        }else if(line.startsWith('event:'))currentEvent=line.substring(6).trim();
        else if(line.startsWith('data:'))eventLines.push(line.substring(5));
      }
    }
  }catch(e){
    if(e.name==='AbortError'){removeLoading();if(!aiText){addAiBubble();updateAiBubble('[已停止]')}}
    else{removeLoading();addAiBubble();updateAiBubble('[错误] '+e.message)}
  }finally{currentAbort=null;setLoading(false);statusEl.textContent='就绪'}
}
function stopGeneration(){if(currentAbort){currentAbort.abort();currentAbort=null}setLoading(false);statusEl.textContent='已停止'}
function quickSend(text){inputBox.value=text;sendMessage()}
function setLoading(v){isLoading=v;sendBtn.style.display=v?'none':'';stopBtn.style.display=v?'':'none';if(v)statusEl.textContent='AI思考中...'}
function clearConversation(){stopGeneration();fetch('/api/chat',{method:'DELETE'});chatList.innerHTML='<div class="welcome-card"><h2>MultiLLM Chat</h2><p>多厂商模型一键切换 | 流式输出 | Markdown &amp; LaTeX</p><div class="suggestions"><button onclick="quickSend(\'用 Java 写一个冒泡排序\')">用 Java 写冒泡排序</button><button onclick="quickSend(\'解释什么是机器学习\')">解释什么是机器学习</button><button onclick="quickSend(\'帮我写一封英文邮件\')">帮我写英文邮件</button></div></div>';inputBox.value='';inputBox.focus();statusEl.textContent='已清空'}

// ===== 滚动 =====
chatList.addEventListener('scroll',()=>{let atBottom=chatList.scrollHeight-chatList.scrollTop-chatList.clientHeight<60;userScrolledUp=!atBottom;backBtn.style.display=userScrolledUp?'block':'none'});
function scrollToBottom(){chatList.scrollTop=chatList.scrollHeight;userScrolledUp=false;backBtn.style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')inputBox.focus()});
inputBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
inputBox.addEventListener('input',()=>{inputBox.style.height='auto';inputBox.style.height=Math.min(inputBox.scrollHeight,120)+'px'});

// ===== 设置对话框 =====
function openSettings(){
  let p=providers.find(x=>x.provider===currentConfig.provider);
  document.getElementById('cfg-provider-name').textContent=(p?p.providerName:'')+' ('+currentConfig.provider+')';
  document.getElementById('cfg-apikey').value=currentConfig.apiKey||'';
  document.getElementById('cfg-baseurl').value=currentConfig.baseUrl||(p?p.baseUrl:'');
  document.getElementById('settings-overlay').style.display='flex';
}
function closeSettings(){document.getElementById('settings-overlay').style.display='none'}
function saveSettings(){
  let apiKey=document.getElementById('cfg-apikey').value.trim();
  let baseUrl=document.getElementById('cfg-baseurl').value.trim();
  if(!apiKey){showToast('请输入API Key');return}
  currentConfig.apiKey=apiKey;
  currentConfig.baseUrl=baseUrl||currentConfig.baseUrl;
  saveCurrentConfig();closeSettings();showToast('配置已保存');
}
function openModelConfig(){
  let list=document.getElementById('config-list');list.innerHTML='';
  providers.forEach(p=>{
    let cfg=savedConfigs[p.provider]||{apiKey:'',modelName:p.modelOptions[0]?.value||''};
    let row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--sep)';
    let info=document.createElement('div');info.innerHTML='<b>'+p.providerName+'</b><br><small style="color:var(--text2)">'+p.provider+' / '+cfg.modelName+'</small>';
    let keyStatus=cfg.apiKey?'<span style="color:green">已配置</span>':'<span style="color:red">未配置</span>';
    let btn=document.createElement('button');btn.className='top-btn';btn.textContent='切换';
    btn.onclick=()=>{currentConfig.provider=p.provider;currentConfig.modelName=cfg.modelName;currentConfig.apiKey=cfg.apiKey;currentConfig.baseUrl=cfg.baseUrl||p.baseUrl;savedConfigs[p.provider]=Object.assign({},currentConfig);saveConfigs();applyCurrentConfig();closeModelConfig();showToast('已切换至 '+p.providerName)};
    row.appendChild(info);row.appendChild(document.createElement('span')).innerHTML=keyStatus;row.appendChild(btn);
    list.appendChild(row);
  });
  document.getElementById('model-config-overlay').style.display='flex';
}
function closeModelConfig(){document.getElementById('model-config-overlay').style.display='none'}

// ===== 启动 =====
loadProviders().then(()=>initSession());
inputBox.focus();
</script></body></html>
