server.port=8080
spring.application.name=deepseek-chatbot
logging.level.root=INFO
logging.level.com.chatbot=INFO

# 文件上传（知识库 PDF 上传；超大文件建议直接放入知识库目录后批量索引）
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB

# H2 文件数据库（自动创建在项目目录下 data/chatbot-db）
spring.datasource.url=jdbc:h2:file:./data/chatbot-db;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
